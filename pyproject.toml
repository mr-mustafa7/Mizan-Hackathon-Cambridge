[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mizan-grid"
version = "0.1.0"
description = "Mizan Grid: multi-hospital trial feasibility, decided safely without trusting any single agent."
license = "Apache-2.0"
urls = { Repository = "https://github.com/mr-mustafa7/Mizan-Hackathon-Cambridge" }
requires-python = ">=3.11"
dependencies = ["flwr==1.35.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["trialgrid"]

[tool.flwr.app]
publisher = "mr-mustafa7"
display-name = "Mizan Grid"
flwr-version-target = "1.35.0"
fab-include = ["trialgrid/**/*.py"]

[tool.flwr.app.config.agent]
input = "We are opening the uncommon-EGFR NSCLC protocol. Can it recruit across our network?"

[tool.flwr.app.config.model]
id = "openai/gpt-5.6-sol"

[tool.flwr.app.config.policy]
min-cell = 5
require-approval = true
approval-token = ""

[tool.flwr.app.components]
agentapp = "trialgrid.agent_app:app"
